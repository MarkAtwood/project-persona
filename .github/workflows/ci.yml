name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories land without any push to this repo: both findings that
    # prompted this job (RUSTSEC-2026-0258, RUSTSEC-2026-0190) appeared
    # against an unchanged Cargo.lock. Re-check daily.
    - cron: '17 6 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this the macOS leg is cancelled the moment ubuntu fails,
      # so each red run reveals at most one platform's problems.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # persona-grpc/build.rs runs protoc; build scripts run under clippy too.
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      # hidapi's linux-static-hidraw backend (via --all-features -> fido2)
      # probes libudev with pkg-config. macOS uses IOKit and needs nothing.
      - name: Install libudev
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: no C dependencies (default features)
        # Scoped to default features: --features fido2 pulls ctap-hid-fido2, whose
        # src/crypto.rs compile_error!s unless `ring` or `aws-lc-rs` is enabled, and
        # which also links the C hidapi. No pure-Rust configuration of fido2 exists.
        run: |
          # --prefix none matters: cargo tree indents with box-drawing characters
          # (U+2502, U+251C), which are not [[:space:]], so an anchored pattern
          # against the default output can only ever match a workspace root and
          # never fires on a transitive dependency.
          if cargo tree -e normal,build --workspace --prefix none \
               | grep -qE '^(ring|cc|aws-lc[a-z-]*) v'; then
            echo "::error::a C-bearing crate re-entered the default dependency graph"
            cargo tree -e normal,build --workspace --prefix none \
              | grep -E '^(ring|cc|aws-lc[a-z-]*) v' | sort -u
            exit 1
          fi

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test --all-targets
        env:
          # SSH_AUTH_SOCK is not available in CI; attestor probes skip gracefully
          SSH_AUTH_SOCK: ""

  portability:
    name: Cross-target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cargo check` runs build scripts but never links, so one ubuntu runner
      # covers every target here with no cross linker and no extra install
      # step beyond the target list itself.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,aarch64-unknown-linux-ohos

      # persona-grpc/build.rs runs protoc, and the workspace check below runs
      # build scripts.
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # persona-core holds the crypto, the HKDF pseudonym derivation and the
      # SPIFFE ID types, and today has no platform surface at all -- no
      # std::env, std::fs, libc or std::os::unix anywhere in it. This step is
      # what keeps it that way. The failure it catches is someone adding one of
      # those to that crate, which nothing else notices until a Windows port
      # begins; no runner tests Windows, and none is proposed, because the
      # crate's tests are byte-exact arithmetic with no platform behaviour to
      # exercise. Checking that it still compiles for the target is the whole
      # of what is worth knowing.
      - name: persona-core stays portable
        run: |
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin aarch64-unknown-linux-ohos; do
            echo "::group::persona-core -> $target"
            cargo check --target "$target" -p persona-core
            echo "::endgroup::"
          done

      # Deliberately not --workspace for Windows: persona-grpc is Unix-only by
      # design -- 21 UnixListener/UnixStream sites, tracked by persona-vvs2 --
      # so that would be a permanently red gate.
      #
      # The macos-latest leg above compiles these same #[cfg(target_os =
      # "macos")] arms, so this is not the only thing that sees them. It fails
      # in seconds on a warm ubuntu runner rather than after a macOS runner
      # queues and builds, and it is the step a developer can run locally on
      # Linux, where those arms are otherwise never type-checked at all.
      - name: whole workspace for darwin
        run: cargo check --target aarch64-apple-darwin --workspace

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89 (MSRV)
        uses: dtolnay/rust-toolchain@1.89
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Run the binary directly rather than rustsec/audit-check so that
      # .cargo/audit.toml is honoured and CI matches `make audit` locally.
      # That file documents one ignore (RUSTSEC-2023-0071, rsa/Marvin) with
      # its reachability argument and re-verification conditions.
      - name: cargo audit
        run: cargo audit
