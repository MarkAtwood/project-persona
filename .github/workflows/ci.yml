name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories land without any push to this repo: both findings that
    # prompted this job (RUSTSEC-2026-0258, RUSTSEC-2026-0190) appeared
    # against an unchanged Cargo.lock. Re-check daily.
    - cron: '17 6 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this the macOS leg is cancelled the moment ubuntu fails,
      # so each red run reveals at most one platform's problems.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # persona-grpc/build.rs runs protoc; build scripts run under clippy too.
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      # hidapi's linux-static-hidraw backend (via --all-features -> fido2)
      # probes libudev with pkg-config. macOS uses IOKit and needs nothing.
      - name: Install libudev
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test --all-targets
        env:
          # SSH_AUTH_SOCK is not available in CI; attestor probes skip gracefully
          SSH_AUTH_SOCK: ""

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.89 (MSRV)
        uses: dtolnay/rust-toolchain@1.89
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Run the binary directly rather than rustsec/audit-check so that
      # .cargo/audit.toml is honoured and CI matches `make audit` locally.
      # That file documents one ignore (RUSTSEC-2023-0071, rsa/Marvin) with
      # its reachability argument and re-verification conditions.
      - name: cargo audit
        run: cargo audit
