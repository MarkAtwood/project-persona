[workspace]
members = [
    "persona-core",
    "persona-attestors",
    "persona-grpc",
    "personad",
    "persona",
    "persona-nmh",
]
resolver = "2"

[workspace.package]
edition = "2021"
version  = "0.1.0"
rust-version = "1.89"

[workspace.dependencies]
persona-core     = { path = "persona-core" }
persona-attestors = { path = "persona-attestors" }
persona-grpc     = { path = "persona-grpc" }

async-trait        = "0.1"
thiserror          = "2"
anyhow             = "1"
tokio              = { version = "1", features = ["full"] }
tokio-stream       = { version = "0.1", features = ["net"] }
tonic              = "0.14"
tonic-prost        = "0.14"
tonic-prost-build  = "0.14"
prost              = "0.14"
prost-types        = "0.14"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
base64             = "0.23"

libc              = "0.2"
tower             = "0.5"
hyper-util        = "0.1"

# Cryptography
ring              = "0.17"
hkdf              = "0.13"
sha2              = "0.11"
rustls            = { version = "0.23", default-features = false, features = ["ring"] }
x509-cert         = "0.3"
jsonwebtoken      = { version = "11", features = ["rust_crypto"] }
